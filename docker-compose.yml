name: tillwise-paypal

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: wproot
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TILLWISE_WP_PORT:-8098}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wpdata:/var/www/html
      - ./wp-plugin/tillwise-store-agent:/var/www/html/wp-content/plugins/tillwise-store-agent

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WP_ENVIRONMENT_TYPE: local
      TILLWISE_WP_PORT: ${TILLWISE_WP_PORT:-8098}
    volumes:
      - wpdata:/var/www/html
      - ./wp-plugin/tillwise-store-agent:/var/www/html/wp-content/plugins/tillwise-store-agent
      - ./scripts:/var/www/html/tillwise-scripts
      - ./tests:/var/www/html/tillwise-tests

volumes:
  dbdata:
  wpdata:
